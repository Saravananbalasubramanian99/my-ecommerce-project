<div class="create-product-page">

  <div class="form-container">

    <h1>Create Product</h1>


    @if (successMessage()) {

      <div class="success-message">
        {{ successMessage() }}
      </div>

    }


    @if (errorMessage()) {

      <div class="error-message">
        {{ errorMessage() }}
      </div>

    }


    <form (ngSubmit)="createProduct()">

      <!-- Product Name -->

      <div class="form-group">

        <label for="name">
          Product Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="product().name"
          required
        >

      </div>


      <!-- Description -->

      <div class="form-group">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          name="description"
          [(ngModel)]="product().description"
          required>
        </textarea>

      </div>


      <!-- Price -->

      <div class="form-group">

        <label for="price">
          Price
        </label>

        <input
          id="price"
          type="number"
          name="price"
          [(ngModel)]="product().price"
          min="0"
          step="0.01"
          required
        >

      </div>


      <!-- Stock -->

      <div class="form-group">

        <label for="stockQuantity">
          Stock Quantity
        </label>

        <input
          id="stockQuantity"
          type="number"
          name="stockQuantity"
          [(ngModel)]="product().stockQuantity"
          min="0"
          required
        >

      </div>


      <!-- Category -->

      <div class="form-group">

        <label for="category">
          Category
        </label>

        <select
          id="category"
          name="categoryId"
          [(ngModel)]="product().categoryId">

          <option [ngValue]="4">
            Electronics
          </option>

          <option [ngValue]="5">
            Health & Beauty
          </option>

        </select>

      </div>


      <!-- Image URL -->

      <div class="form-group">

        <label for="imageUrl">
          Image URL
        </label>

        <input
          id="imageUrl"
          type="text"
          name="imageUrl"
          [(ngModel)]="product().imageUrl"
        >

      </div>


      <!-- Buttons -->

      <div class="button-container">

        <button
          type="submit"
          [disabled]="loading()">

          @if (loading()) {
            Creating...
          } @else {
            Create Product
          }

        </button>


        <button
          type="button"
          class="cancel-button"
          (click)="cancel()">

          Cancel

        </button>

      </div>

    </form>

  </div>

</div>
