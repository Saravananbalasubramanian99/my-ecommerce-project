name: E-Commerce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the project code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build and test Spring Boot backend
      - name: Build and test backend
        working-directory: ecommerce-backend
        run: ./mvnw clean test

      # 4. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ecommerce-frontend/package-lock.json

      # 5. Install Angular dependencies
      - name: Install frontend dependencies
        working-directory: ecommerce-frontend
        run: npm ci

      # 6. Build Angular frontend
      - name: Build frontend
        working-directory: ecommerce-frontend
        run: npm run build